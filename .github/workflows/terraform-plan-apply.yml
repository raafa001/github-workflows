name: Terraform Plan/Apply/Destroy

'on':
  workflow_call:
    inputs:
      working-dirs:
        description: JSON array of working directories
        required: true
        type: string
      command:
        description: Terraform command (plan/apply/destroy)
        required: false
        type: string
        default: plan
      confirm:
        description: Confirmation for apply/destroy
        required: false
        type: string
        default: "false"
      pr-number:
        description: PR number for comments
        required: false
        type: number
        default: 0
      ref:
        description: Git ref to checkout
        required: false
        type: string
        default: ""
    # ALTERAÇÃO 1: Declarar explicitamente os secrets que o workflow reutilizável vai receber
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: Terraform ${{ inputs.command }}
    runs-on: ubuntu-latest
    
    # ALTERAÇÃO 2: Injetar as credenciais como variáveis de ambiente para TODO o job.
    # Assim, o Init, Plan, Apply e Destroy terão acesso automático às chaves da AWS.
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1 # Altere para a sua região padrão caso necessário

    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(inputs.working-dirs) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: |
            ${{ inputs.ref ||
              github.event.pull_request.head.sha ||
              github.sha }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.0

      - name: Authenticate private modules
        run: |
          TOKEN="${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}"
          git config --global \
            url."https://x-access-token:${TOKEN}@github.com/".insteadOf \
            "https://github.com/"
          cat <<EOF >> ~/.netrc
          machine github.com
            login x-access-token
            password ${TOKEN}
          EOF
          chmod 600 ~/.netrc

      - name: Terraform Init
        id: init
        run: terraform init -backend=false -no-color 2>&1 | tee init_output.txt
        working-directory: ${{ matrix.dir }}

      - name: Terraform Plan
        if: inputs.command == 'plan'
        id: plan
        run: |
          terraform plan -no-color -out=tfplan 2>&1 | tee plan_output.txt
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        working-directory: ${{ matrix.dir }}
        continue-on-error: true

      - name: Confirm apply/destroy
        if: inputs.command != 'plan'
        env:
          REPO_URL: >-
            ${{ github.server_url }}/${{ github.repository }}
        run: |
          RUN_ID="${{ github.run_id }}"
          RUN_URL="${REPO_URL}/actions/runs/${RUN_ID}"
          if [ "${{ inputs.confirm }}" != "yes" ]; then
            echo "Confirmation required. Set 'confirm: yes' to proceed."
            echo "Run URL: ${RUN_URL}"
            exit 1
          fi
          echo "Confirmation received. Proceeding with ${{ inputs.command }}."

      - name: Terraform Apply
        if: inputs.command == 'apply' && inputs.confirm == 'yes'
        run: terraform apply -auto-approve -no-color 2>&1
        working-directory: ${{ matrix.dir }}

      - name: Terraform Destroy
        if: inputs.command == 'destroy' && inputs.confirm == 'yes'
        run: terraform destroy -auto-approve -no-color 2>&1
        working-directory: ${{ matrix.dir }}

      - name: Post comment to PR
        if: inputs.pr-number != 0 && inputs.command == 'plan'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const planFile = '${{ matrix.dir }}/plan_output.txt';
            let planOutput = 'Plan file not found';
            try {
              planOutput = fs.readFileSync(planFile, 'utf8');
            } catch(e) {}
            const truncated = planOutput.length > 60000
              ? planOutput.substring(0, 60000) + '\n... (truncated)'
              : planOutput;
            const repoUrl = '${{ github.server_url }}/${{ github.repository }}';
            const runUrl = [
              repoUrl,
              '/actions/runs/',
              '${{ github.run_id }}'
            ].join('');
            const wfUrl = [
              repoUrl,
              '/actions/workflows/',
              'terraform-automation.yml'
            ].join('');
            const body = [
              '## Terraform Plan - ${{ matrix.dir }}',
              '```',
              truncated,
              '```',
              '**Actions:**',
              '- [Apply this plan](' + wfUrl + ') ' +
                '(set `command: apply` and `confirm: yes`)',
              '- [Destroy resources](' + wfUrl + ') ' +
                '(set `command: destroy` and `confirm: yes`)',
              '- [View this run](' + runUrl + ')'
            ].join('\n');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ inputs.pr-number }},
              body: body
            });

      - name: Post apply/destroy confirmation to PR
        if: inputs.pr-number != 0 && inputs.command != 'plan'
        uses: actions/github-script@v9
        with:
          script: |
            const confirmed = '${{ inputs.confirm }}' === 'yes';
            const repoUrl = '${{ github.server_url }}/${{ github.repository }}';
            const runUrl = [
              repoUrl,
              '/actions/runs/',
              '${{ github.run_id }}'
            ].join('');
            const status = confirmed
              ? 'completed successfully'
              : 'requires confirmation';
            const actionNeeded = confirmed
              ? ''
              : '⚠️ **Action needed:** Go to [' +
                '${{ github.workflow }}](' + runUrl +
                ') and re-run with `confirm: yes` to proceed.';
            const body = [
              '## Terraform ${{ inputs.command }} - ${{ matrix.dir }}',
              'Status: ' + status,
              '[View run details](' + runUrl + ')',
              '',
              actionNeeded
            ].join('\n');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ inputs.pr-number }},
              body: body
            });
